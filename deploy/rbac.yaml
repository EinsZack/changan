apiVersion: v1
kind: Namespace
metadata:
  name: changan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: changan
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator
  namespace: changan
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log", "events"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator
  namespace: changan
subjects:
- kind: ServiceAccount
  name: orchestrator
  namespace: changan
roleRef:
  kind: Role
  name: orchestrator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: changan-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: changan-node-reader
subjects:
- kind: ServiceAccount
  name: orchestrator
  namespace: changan
roleRef:
  kind: ClusterRole
  name: changan-node-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-access
  namespace: changan
  annotations:
    kubernetes.io/service-account.name: orchestrator
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: video-budget
  namespace: changan
spec:
  hard:
    pods: "12"
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "16"
    limits.memory: 16Gi
